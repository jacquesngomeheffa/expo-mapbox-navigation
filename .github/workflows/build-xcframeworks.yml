name: Verify Mapbox Navigation xcframeworks fetch

# Manual trigger only — a CI sanity check that ios/fetch-xcframeworks.sh
# still works end-to-end (e.g. after bumping MAPBOX_NAV_VERSION), NOT a
# way to publish binaries from this repo. ios/Frameworks/*.xcframework is
# deliberately NOT committed anywhere (see .gitignore) — Mapbox's own
# Product Terms ("1.10. No Redistribution") prohibit redistributing their
# SDK binaries to third parties who haven't authenticated with their own
# Mapbox account/token, and this repository is public. Instead, the
# CONSUMING app fetches these binaries itself, using its own token, at
# `pod install` time (see ExpoMapboxNavigation.podspec's
# s.prepare_command). Runs on a free GitHub-hosted macOS runner (macOS
# runners are free & unlimited for public repositories).
on:
  workflow_dispatch:
    inputs:
      mapbox_nav_version:
        description: 'mapbox-navigation-ios-build-artifacts version tag to test (e.g. 3.20.1)'
        required: true
        default: '3.20.1'

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Configure Mapbox downloads credentials
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          if [ -z "$MAPBOX_DOWNLOADS_TOKEN" ]; then
            echo "::error::MAPBOX_DOWNLOADS_TOKEN secret is not set. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          cat > ~/.netrc << EOF
          machine api.mapbox.com
          login mapbox
          password $MAPBOX_DOWNLOADS_TOKEN
          EOF
          chmod 600 ~/.netrc

      - name: Fetch prebuilt xcframeworks (with retry)
        uses: nick-fields/retry@v3
        env:
          MAPBOX_NAV_VERSION: ${{ inputs.mapbox_nav_version }}
        with:
          timeout_minutes: 30
          max_attempts: 1
          retry_wait_seconds: 15
          command: |
            chmod +x ios/fetch-xcframeworks.sh
            ./ios/fetch-xcframeworks.sh

      - name: Verify frameworks were produced
        run: |
          ls -la ios/Frameworks/
          test -d "ios/Frameworks/MapboxNavigationCore.xcframework" || { echo "::error::MapboxNavigationCore.xcframework missing"; exit 1; }
          test -d "ios/Frameworks/MapboxNavigationUIKit.xcframework" || { echo "::error::MapboxNavigationUIKit.xcframework missing"; exit 1; }
          test -d "ios/Frameworks/MapboxNavigationNative.xcframework" || { echo "::error::MapboxNavigationNative.xcframework missing"; exit 1; }
          test -d "ios/Frameworks/MapboxDirections.xcframework" || { echo "::error::MapboxDirections.xcframework missing"; exit 1; }
          test -d "ios/Frameworks/_MapboxNavigationHelpers.xcframework" || { echo "::error::_MapboxNavigationHelpers.xcframework missing"; exit 1; }
          test -d "ios/Frameworks/_MapboxNavigationLocalization.xcframework" || { echo "::error::_MapboxNavigationLocalization.xcframework missing"; exit 1; }
          echo "::notice::All expected xcframeworks were fetched successfully. Not committed anywhere (see .gitignore) — consuming apps fetch these themselves at pod install time."
