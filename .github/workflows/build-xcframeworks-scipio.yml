name: "[EXPERIMENTAL] Build Mapbox Navigation xcframeworks via Scipio (from source)"

# ⚠️ EXPERIMENTAL — an ALTERNATIVE to build-xcframeworks.yml, not a
# replacement. That workflow (and ios/fetch-xcframeworks.sh, which it
# calls) is left completely untouched and remains the proven default.
#
# This workflow calls ios/fetch-xcframeworks-scipio.sh instead — see that
# script's own header comment for the full reasoning, status, and known
# gaps. In short: it builds MapboxNavigationCore/UIKit/etc. from SOURCE via
# Scipio, rather than downloading Mapbox's own precompiled
# mapbox-navigation-ios-build-artifacts binaries, as an attempt to resolve
# a real production launch crash that persisted even with the correct
# MapboxMaps version confirmed resolved by CocoaPods.
#
# UNTESTED end-to-end as of writing — expect to iterate on real failures
# here, not a clean first run.
on:
  workflow_dispatch:
    inputs:
      mapbox_nav_version:
        description: 'mapbox-navigation-ios SOURCE tag (e.g. 3.11.0) — must have a real vX.Y.Z git tag on that repo'
        required: true
        default: '3.11.0'
      xcode_version:
        description: 'Xcode version for maxim-lobanov/setup-xcode (e.g. 16.4, 16.2, 15.4) — added after a real run failed with a posix_spawn "No such file or directory" error for Xcode 16.4s internal xcbuild tool; try a different version here without editing this file.'
        required: true
        default: '16.4'

jobs:
  build:
    runs-on: macos-15
    # Longer timeout than the precompiled-artifacts workflow — this compiles
    # from source instead of downloading prebuilt binaries, which is
    # meaningfully slower. 30 minutes was enough for the download-only flow;
    # this is a guess at a safe ceiling, not a measured figure — adjust
    # after a real run shows actual timing.
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode_version }}

      - name: Ensure a matching iOS Simulator runtime is installed
        # FIX, found from a real build log + a matching precedent on Apple's
        # own developer forums (same exact error message, same root cause):
        # "No simulator runtime version from [...] available to use with
        # iphonesimulator SDK version [...]" happens when only the
        # iphonesimulator SDK/tooling is present but no matching Simulator
        # RUNTIME (disk image) is actually installed — common right after
        # switching Xcode versions via maxim-lobanov/setup-xcode, which only
        # switches the active Xcode.app symlink and doesn't guarantee a
        # matching simulator runtime is installed for that specific version.
        # This surfaced as an asset catalog (actool) failure inside
        # mapbox-maps-ios's own source (IndicatorAssets.xcassets) when
        # Scipio's --support-simulators flag builds for iphonesimulator.
        run: xcodebuild -downloadPlatform iOS

      - name: Diagnostic — check XCBuild path across every installed Xcode version
        run: |
          echo "🔍 Checking the exact path a real build failed on, across every Xcode install on this runner:"
          echo "   (posix_spawn: No such file or directory, /Contents/SharedFrameworks/XCBuild.framework/Versions/A/Support/xcbuild)"
          echo ""
          for app in /Applications/Xcode*.app; do
            # Skip symlink aliases (e.g. Xcode_16.4.0.app -> Xcode_16.4.app) —
            # only check real directories, to avoid printing the same result twice.
            if [ -L "$app" ]; then
              continue
            fi
            CANDIDATE="$app/Contents/SharedFrameworks/XCBuild.framework/Versions/A/Support/xcbuild"
            if [ -f "$CANDIDATE" ]; then
              echo "  ✅ FOUND in $app"
            else
              echo "  ❌ missing in $app"
            fi
          done
          echo ""
          echo "ℹ️  Use whichever version(s) show ✅ above as the 'xcode_version' input on the next run."

      - name: Configure Mapbox downloads credentials
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          if [ -z "$MAPBOX_DOWNLOADS_TOKEN" ]; then
            echo "::error::MAPBOX_DOWNLOADS_TOKEN secret is not set. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          cat > ~/.netrc << EOF
          machine api.mapbox.com
          login mapbox
          password $MAPBOX_DOWNLOADS_TOKEN
          EOF
          chmod 600 ~/.netrc

      - name: Build xcframeworks from source via Scipio
        env:
          MAPBOX_NAV_VERSION: ${{ inputs.mapbox_nav_version }}
        run: |
          chmod +x ios/fetch-xcframeworks-scipio.sh
          ./ios/fetch-xcframeworks-scipio.sh

      - name: Verify frameworks were produced
        run: |
          ls -la ios/Frameworks/
          test -d "ios/Frameworks/MapboxNavigationCore.xcframework" || { echo "::error::MapboxNavigationCore.xcframework missing"; exit 1; }
          test -d "ios/Frameworks/MapboxNavigationUIKit.xcframework" || { echo "::error::MapboxNavigationUIKit.xcframework missing"; exit 1; }
          test -d "ios/Frameworks/MapboxDirections.xcframework" || { echo "::error::MapboxDirections.xcframework missing — see the KNOWN GAPS note in fetch-xcframeworks-scipio.sh"; exit 1; }
          if [ ! -d "ios/Frameworks/MapboxNavigationNative.xcframework" ]; then
            echo "::warning::MapboxNavigationNative.xcframework is missing — this is a KNOWN, documented gap in fetch-xcframeworks-scipio.sh, not yet resolved. Do not merge/publish from this branch until it's handled."
          fi

      - name: Upload frameworks as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapbox-navigation-xcframeworks-scipio-${{ inputs.mapbox_nav_version }}
          path: ios/Frameworks/
          retention-days: 30

      - name: Commit frameworks to a branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="xcframeworks-scipio/${{ inputs.mapbox_nav_version }}"
          git checkout -b "$BRANCH"
          git add -f ios/Frameworks/
          git commit -m "Build mapbox-navigation-ios ${{ inputs.mapbox_nav_version }} xcframeworks from source via Scipio (experimental)"
          git push origin "$BRANCH" --force
          echo "::notice::Pushed to branch $BRANCH — DO NOT merge or publish from this branch without validating on a real device first. This is an experimental, unproven build path."
