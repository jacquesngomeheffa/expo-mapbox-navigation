name: Verify pod install fetches xcframeworks

# Manual trigger only. This directly answers a real, open question from a
# real debugging session: does ExpoMapboxNavigation.podspec's own
# s.prepare_command actually run and populate ios/Frameworks/ during a
# real `pod install`? A real Navio build log showed zero visible output
# from this step either way, leaving genuine ambiguity.
#
# REDESIGNED after two failed attempts at hand-reconstructing a minimal
# Podfile from scratch, each revealing another missing piece of Expo's
# own CocoaPods integration (ExpoModulesCore isn't a public CocoaPods
# trunk pod; its own podspec needs a custom `Pod::Expo` Ruby constant
# that only `use_expo_modules!` sets up). Rather than continue chasing
# these one at a time, this now generates a REAL, minimal Expo app via
# `create-expo-app` and runs REAL `expo prebuild`, so Expo's own tooling
# produces the Podfile - guaranteed to match what EAS Build actually
# does, not this project's own approximation of it.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: package-under-test

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Mapbox downloads credentials
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          if [ -z "$MAPBOX_DOWNLOADS_TOKEN" ]; then
            echo "::error::MAPBOX_DOWNLOADS_TOKEN secret is not set. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          cat > ~/.netrc << EOF
          machine api.mapbox.com
          login mapbox
          password $MAPBOX_DOWNLOADS_TOKEN
          EOF
          chmod 600 ~/.netrc

      - name: Create a real, minimal Expo app
        run: npx --yes create-expo-app@latest test-harness

      # CHANGED after a real run confirmed `expo prebuild` failed with
      # "PluginError: Cannot find module '@expo/config-plugins'" trying to
      # load this package's own plugin. Root cause: `npm install
      # ../package-under-test` (a local path) installs via a SYMLINK
      # pointing OUTSIDE test-harness/ entirely (at the sibling
      # package-under-test/ checkout) - so when Node resolves `require()`
      # calls from inside the plugin, it walks up the symlink TARGET's
      # real directory tree (which has no node_modules of its own), not
      # test-harness/node_modules where @expo/config-plugins actually
      # lives (hoisted there via the `expo` package's own dependencies).
      # `npm pack` + installing the resulting tarball copies the package
      # instead of symlinking it - exactly how a real `npm install` from
      # the registry behaves, avoiding this entire class of local-path
      # resolution quirk.
      - name: Pack this package into a real tarball
        working-directory: package-under-test
        run: npm pack --pack-destination /tmp

      - name: Install this package from that tarball (not a symlinked local path)
        working-directory: test-harness
        run: |
          TARBALL=$(ls /tmp/jacques_gordon-expo-mapbox-navigation-*.tgz)
          echo "Installing $TARBALL"
          npm install "$TARBALL"

      - name: Configure app.json with this package's plugin
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        working-directory: test-harness
        run: |
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("app.json", "utf8"));
            config.expo.ios = config.expo.ios || {};
            config.expo.ios.bundleIdentifier = "com.example.testharness";
            config.expo.plugins = config.expo.plugins || [];
            config.expo.plugins.push([
              "@jacques_gordon/expo-mapbox-navigation",
              {
                accessToken: "pk.placeholder",
                downloadsToken: process.env.MAPBOX_DOWNLOADS_TOKEN,
              },
            ]);
            fs.writeFileSync("app.json", JSON.stringify(config, null, 2));
            console.log(JSON.stringify(config, null, 2));
          '

      - name: Run expo prebuild (generates the real Podfile, exactly like EAS Build)
        working-directory: test-harness
        run: npx expo prebuild --platform ios --no-install

      - name: Run real pod install (verbose, to settle the visibility question directly)
        working-directory: test-harness/ios
        run: |
          pod install --verbose 2>&1 | tee pod_install_full.log

      - name: Check whether ios/Frameworks was actually populated
        run: |
          FRAMEWORKS_DIR="test-harness/node_modules/@jacques_gordon/expo-mapbox-navigation/ios/Frameworks"
          echo "Contents of $FRAMEWORKS_DIR:"
          ls -la "$FRAMEWORKS_DIR" 2>&1 || echo "(directory does not exist)"
          echo ""
          if [ -d "$FRAMEWORKS_DIR/MapboxNavigationCore.xcframework" ]; then
            echo "::notice::MapboxNavigationCore.xcframework was fetched successfully - prepare_command works as intended."
          else
            echo "::error::MapboxNavigationCore.xcframework is missing after a real pod install. prepare_command did not do what it was supposed to."
            exit 1
          fi

      - name: Upload full pod install log as an artifact (for inspection regardless of pass/fail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pod-install-verbose-log
          path: test-harness/ios/pod_install_full.log
          retention-days: 14
